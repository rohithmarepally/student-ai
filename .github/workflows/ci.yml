name: Continuous Integration

on:
  push:
    branches:
      - main
      - "milestone-*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      GEMINI_API_KEY: test-gemini-key
      ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_HMAC_KEY: test-rate-limit-key-that-is-longer-than-thirty-two-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check backend dependencies
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend lint and build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run production build
        run: npm run build

  security:
    name: Secret-pattern scan

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check common secret patterns
        shell: bash
        run: |
          pattern='AI''za|sb_''secret_|sk-''proj-'

          if git grep -q -E "$pattern" -- .; then
            echo "Potential committed secret detected."
            exit 1
          fi

          echo "No matching secret pattern detected."
